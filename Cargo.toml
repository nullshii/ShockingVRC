[workspace]
resolver = "2"
members = ["src-cli", "src-core"]

[workspace.package]
version = "1.0.4"
edition = "2024"
authors = ["nullshii", "Amigo_FPS"]

[workspace.dependencies]
shocking_vrc_core = { path = "src-core" }
shocking_vrc_cli = { path = "src-cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

btleplug = "0.12.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
uuid = "1.23.2"
flate2 = "1"
base64 = "0.22"
thiserror = "2"
log = "0.4.32"
env_logger = "0.11"
rand = "0.10.1"
rosc = "0.11.4"
mdns-sd = "0.20.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
semver = "1"
futures-util = "0.3"
ratatui = "0.30.1"
crossterm = "0.29.0"

[profile.release]
debug = "limited"
strip = false

[profile.distribution]
inherits = "release"
lto = true
