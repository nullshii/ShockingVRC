[workspace]
resolver = "2"
members = ["src-cli", "src-core"]

[workspace.package]
version = "1.2.1"
edition = "2024"
authors = ["nullshii", "Amigo_FPS"]

[workspace.dependencies]
shocking_vrc_core = { path = "src-core" }
shocking_vrc_cli = { path = "src-cli" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

btleplug = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = "0.1.19"
uuid = "1.24.0"
flate2 = "1"
base64 = "0.23.0"
thiserror = "2.0.19"
log = "0.4.33"
env_logger = "0.11.11"
rand = "0.10.2"
rosc = "0.11.4"
mdns-sd = "0.20.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
semver = "1"
futures-util = "0.3.33"
ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
debug = "limited"
strip = false

[profile.distribution]
inherits = "release"
lto = true
