[package]
name = "shockingvrc-signal"
version = "2.2.1"
edition = "2024"
publish = false
description = "Rendezvous, signaling and TURN credentials for ShockingVRC partner remote"

[workspace]

[[bin]]
name = "signal"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
